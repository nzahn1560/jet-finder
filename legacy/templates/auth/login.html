<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Jet Finder</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Rajdhani', sans-serif; 
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(240, 85, 69, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(240, 85, 69, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }
        .container { 
            background: linear-gradient(135deg, #1a1a1a 0%, #212529 100%);
            padding: 50px 40px; 
            border-radius: 16px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(240, 85, 69, 0.2);
            width: 100%; 
            max-width: 450px;
            position: relative;
            z-index: 1;
            border: 2px solid #F05545;
        }
        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-icon {
            font-size: 48px;
            color: #F05545;
            margin-bottom: 10px;
        }
        h1 { 
            font-size: 32px; 
            margin-bottom: 10px; 
            color: #ffffff;
            font-weight: 700;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
        }
        .subtitle { 
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
            text-align: center;
            font-size: 16px;
        }
        .form-group { margin-bottom: 24px; }
        label { 
            display: block; 
            margin-bottom: 10px; 
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input { 
            width: 100%; 
            padding: 14px 16px; 
            background: #000000;
            border: 2px solid #343a40;
            border-radius: 8px; 
            font-size: 15px;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            transition: all 0.3s ease;
        }
        input:focus { 
            outline: none; 
            border-color: #F05545;
            box-shadow: 0 0 0 3px rgba(240, 85, 69, 0.2);
            background: #0a0a0a;
        }
        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        button { 
            width: 100%; 
            padding: 16px; 
            background: linear-gradient(135deg, #F05545, #d44437);
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: 700;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(240, 85, 69, 0.3);
        }
        button:hover { 
            background: linear-gradient(135deg, #d44437, #F05545);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(240, 85, 69, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .error { 
            background: rgba(255, 71, 87, 0.15);
            color: #ff4757;
            padding: 14px 16px; 
            border-radius: 8px; 
            margin-bottom: 20px;
            border: 1px solid rgba(255, 71, 87, 0.3);
            font-weight: 500;
        }
        .success { 
            background: rgba(0, 255, 136, 0.15);
            color: #00ff88;
            padding: 14px 16px; 
            border-radius: 8px; 
            margin-bottom: 20px;
            border: 1px solid rgba(0, 255, 136, 0.3);
            font-weight: 500;
        }
        .link { 
            text-align: center; 
            margin-top: 24px; 
            color: rgba(255, 255, 255, 0.7);
            font-size: 15px;
        }
        .link a { 
            color: #F05545;
            text-decoration: none; 
            font-weight: 700;
            transition: color 0.3s ease;
        }
        .link a:hover {
            color: #ff6b5e;
            text-decoration: underline;
        }
        .input-icon {
            position: relative;
        }
        .input-icon i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.4);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <div class="logo-icon">
                <i class="fas fa-plane-arrival"></i>
            </div>
            <h1>Welcome Back</h1>
            <p class="subtitle">Log in to your account</p>
        </div>
        
        <div id="message"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email"><i class="fas fa-envelope me-2"></i>Email</label>
                <div class="input-icon">
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password"><i class="fas fa-lock me-2"></i>Password</label>
                <div class="input-icon">
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>
            
            <button type="submit">
                <i class="fas fa-sign-in-alt me-2"></i>Log In
            </button>
        </form>
        
        <div class="link">
            Don't have an account? <a href="/signup">Sign up <i class="fas fa-arrow-right ms-1"></i></a>
        </div>
    </div>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    // Verify login by calling /api/auth/me
                    try {
                        const meResponse = await fetch('/api/auth/me', {
                            method: 'GET',
                            credentials: 'include'
                        });
                        if (meResponse.ok) {
                            const meData = await meResponse.json();
                            console.log('✅ Logged in as:', meData.user?.email);
                        }
                    } catch (e) {
                        console.warn('Could not verify login:', e);
                    }
                    document.getElementById('message').innerHTML = '<div class="success"><i class="fas fa-check-circle me-2"></i>Logged in! Redirecting...</div>';
                    setTimeout(() => window.location.href = '/dashboard', 1500);
                } else {
                    document.getElementById('message').innerHTML = `<div class="error"><i class="fas fa-exclamation-circle me-2"></i>${result.error}</div>`;
                }
            } catch (err) {
                document.getElementById('message').innerHTML = '<div class="error"><i class="fas fa-exclamation-triangle me-2"></i>An error occurred. Please try again.</div>';
            }
        });
    </script>
</body>
</html>
