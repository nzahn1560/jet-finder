{% extends "base.html" %}

{% block title %}Off Market - Jet Finder{% endblock %}
{% block extra_head %}<meta name="robots" content="noindex, nofollow">{% endblock %}
{% block additional_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/sections.css') }}">
{% endblock %}

{% block content %}
<div class="section-page">
    <h1>Off market <span class="nav-tag">Brokers only</span></h1>
    <div class="om-switch" role="tablist">
        <button type="button" class="om-switch__btn is-active" data-intent="sale">For sale</button>
        <button type="button" class="om-switch__btn" data-intent="wanted">Wanted</button>
    </div>
    <div class="om-tools">
        <select id="om-make" class="form-select" aria-label="Manufacturer"></select>
        <input id="om-model" class="form-control" type="search" placeholder="Model" autocomplete="off">
        <a class="section-btn" href="{{ url_for('create_listing') }}?market=off_market">New listing</a>
    </div>
    <div id="om-grid" class="om-grid"></div>
    <p id="om-empty" class="section-empty" hidden>No aircraft match that manufacturer and model.</p>
    <aside id="om-contact" class="om-contact" hidden>
        <h2 id="om-contact-title"></h2>
        <p id="om-contact-name"></p>
        <p id="om-contact-company"></p>
        <p id="om-contact-email"></p>
        <p id="om-contact-phone"></p>
    </aside>
</div>
<script>
(function () {
    const listings = {{ listings|tojson }};
    const makeEl = document.getElementById('om-make');
    const modelEl = document.getElementById('om-model');
    const grid = document.getElementById('om-grid');
    const empty = document.getElementById('om-empty');
    const contactEl = document.getElementById('om-contact');
    let intent = 'sale';
    let selectedId = null;
    const makes = [...new Set(listings.map(function (item) { return item.manufacturer || ''; }).filter(Boolean))].sort();
    makeEl.innerHTML = '<option value="">All manufacturers</option>' + makes.map(function (name) {
        return '<option value="' + name.replace(/"/g, '&quot;') + '">' + name + '</option>';
    }).join('');

    function money(value) {
        const amount = Number(value);
        if (!Number.isFinite(amount) || amount <= 0) return '';
        return '$' + amount.toLocaleString();
    }

    function esc(value) {
        return String(value || '').replace(/[&<>"']/g, function (ch) {
            return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
        });
    }
    function render() {
        const make = (makeEl.value || '').toLowerCase();
        const model = (modelEl.value || '').trim().toLowerCase();
        const shown = listings.filter(function (item) {
            const itemMake = (item.manufacturer || '').toLowerCase();
            const itemModel = ((item.model || '') + ' ' + (item.title || '')).toLowerCase();
            const itemIntent = item.intent === 'wanted' ? 'wanted' : 'sale';
            if (itemIntent !== intent) return false;
            if (make && itemMake !== make) return false;
            if (model && itemModel.indexOf(model) < 0) return false;
            return true;
        });
        empty.hidden = shown.length > 0;
        empty.textContent = intent === 'wanted'
            ? 'No aircraft wanted match that manufacturer and model.'
            : 'No aircraft for sale match that manufacturer and model.';
        grid.innerHTML = shown.map(function (item) {
            const price = money(item.price);
            const hours = Number(item.hours) > 0 ? Number(item.hours).toLocaleString() + ' hrs' : '';
            const meta = [item.manufacturer, item.model, item.year, hours].filter(Boolean).join(' · ');
            const place = item.location || '';
            const selected = String(item.id) === String(selectedId) ? ' is-selected' : '';
            return '<button type="button" class="om-card' + selected + '" data-id="' + item.id + '">'
                + '<h2>' + esc(item.title || 'Aircraft') + '</h2>'
                + '<p>' + esc(meta) + '</p>'
                + (place ? '<p class="om-card__meta">' + esc(place) + '</p>' : '')
                + (price ? '<p class="om-card__price">' + esc(price) + '</p>' : '')
                + '</button>';
        }).join('');
        if (selectedId && !shown.some(function (item) { return String(item.id) === String(selectedId); })) {
            contactEl.hidden = true;
            selectedId = null;
        }
    }
    function showContact(item) {
        const contact = item.contact || {};
        document.getElementById('om-contact-title').textContent = item.title || 'Aircraft';
        document.getElementById('om-contact-name').textContent = contact.name || 'Seller';
        const company = document.getElementById('om-contact-company');
        company.textContent = contact.company || '';
        company.hidden = !contact.company;
        const email = document.getElementById('om-contact-email');
        email.innerHTML = contact.email ? '<a href="mailto:' + esc(contact.email) + '">' + esc(contact.email) + '</a>' : '';
        email.hidden = !contact.email;
        const phone = document.getElementById('om-contact-phone');
        phone.innerHTML = contact.phone ? '<a href="tel:' + esc(contact.phone) + '">' + esc(contact.phone) + '</a>' : '';
        phone.hidden = !contact.phone;
        contactEl.hidden = false;
    }
    grid.addEventListener('click', function (event) {
        const card = event.target.closest('.om-card');
        if (!card) return;
        const id = card.getAttribute('data-id');
        if (String(selectedId) === String(id)) {
            selectedId = null;
            contactEl.hidden = true;
            render();
            return;
        }
        const item = listings.find(function (row) { return String(row.id) === String(id); });
        if (!item) return;
        selectedId = item.id;
        showContact(item);
        render();
    });
    makeEl.addEventListener('change', render);
    modelEl.addEventListener('input', render);
    document.querySelectorAll('.om-switch__btn').forEach(function (button) {
        button.addEventListener('click', function () {
            intent = button.getAttribute('data-intent') || 'sale';
            document.querySelectorAll('.om-switch__btn').forEach(function (other) {
                other.classList.toggle('is-active', other === button);
            });
            render();
        });
    });
    render();
})();
</script>
{% endblock %}
