{% extends "base.html" %}

{% block title %}Contact - JetSchool{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 720px;">
    <article class="contact-card">
        <p class="contact-card__kicker">JetSchool</p>
        <h1>Contact</h1>
        <p class="contact-card__lead">Send a note about a listing, an account, or the information on this site. Messages are read by JetSchool administration.</p>
        <form id="contact-form">
            <label for="contact-name">Name</label>
            <input id="contact-name" name="name" maxlength="120" required autocomplete="name">
            <label for="contact-email">Email</label>
            <input id="contact-email" name="email" type="email" maxlength="254" required autocomplete="email">
            <label for="contact-phone">Phone <span>optional</span></label>
            <input id="contact-phone" name="phone" maxlength="40" autocomplete="tel">
            <label for="contact-message">Message</label>
            <textarea id="contact-message" name="message" maxlength="4000" required rows="6"></textarea>
            <input class="contact-card__trap" tabindex="-1" autocomplete="off" name="company_url" aria-hidden="true">
            <button type="submit" id="contact-send">Send message</button>
            <p id="contact-status" role="status"></p>
        </form>
    </article>
</div>
<style>
    .contact-card {
        background: #141414;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 2rem 1.75rem 1.6rem;
        color: #f4f4f4;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
    }
    .contact-card__kicker {
        margin: 0 0 0.3rem;
        color: #F05545;
        font-family: 'Rajdhani', sans-serif;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
    }
    .contact-card h1 {
        margin: 0 0 0.55rem;
        color: #fff;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 2.1rem;
    }
    .contact-card__lead {
        margin: 0 0 1.3rem;
        color: #d7d7d7;
        line-height: 1.5;
    }
    .contact-card label {
        display: block;
        margin: 0.85rem 0 0.3rem;
        color: #fff;
        font-family: 'Rajdhani', sans-serif;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.03em;
    }
    .contact-card label span {
        color: #9a9a9a;
        font-weight: 500;
    }
    .contact-card input,
    .contact-card textarea {
        width: 100%;
        background: #0e0e0e;
        color: #fff;
        border: 1px solid #3a3a3a;
        border-radius: 8px;
        padding: 0.7rem 0.8rem;
        font-size: 1rem;
    }
    .contact-card textarea { resize: vertical; }
    .contact-card__trap { position: absolute; left: -9999px; height: 0; width: 0; opacity: 0; }
    #contact-send {
        margin-top: 1.1rem;
        border: 0;
        border-radius: 8px;
        background: #F05545;
        color: #fff;
        font-family: 'Rajdhani', sans-serif;
        font-size: 1.05rem;
        font-weight: 700;
        padding: 0.7rem 1.25rem;
        cursor: pointer;
    }
    #contact-send:hover { background: #ff6a58; }
    #contact-status { min-height: 1.4rem; margin: 0.75rem 0 0; color: #d8d8d8; }
</style>
<script>
(function () {
    const form = document.getElementById('contact-form');
    const status = document.getElementById('contact-status');
    form.addEventListener('submit', async function (event) {
        event.preventDefault();
        status.textContent = 'Sending…';
        const token = document.querySelector('meta[name="csrf-token"]');
        const response = await fetch('/api/contact', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRF-Token': token ? token.getAttribute('content') : '',
            },
            body: JSON.stringify({
                name: document.getElementById('contact-name').value,
                email: document.getElementById('contact-email').value,
                phone: document.getElementById('contact-phone').value,
                message: document.getElementById('contact-message').value,
                company_url: form.company_url.value,
            }),
        });
        const data = await response.json().catch(function () { return {}; });
        if (!response.ok) {
            status.textContent = data.error || 'Could not send that message.';
            return;
        }
        form.reset();
        status.textContent = 'Message received. JetSchool will review it.';
    });
})();
</script>
{% endblock %}
