{% extends "base.html" %}

{% block title %}{{ ((user.first_name or '') ~ ' ' ~ (user.last_name or ''))|trim or 'Profile' }} - Jet Finder{% endblock %}
{% block additional_css %}
<style>
    .profile-page { position: relative; z-index: 1; background: #0d0d0d; min-height: 70vh; padding: 2rem 0 4rem; }
    .profile-page__inner { max-width: 980px; margin: 0 auto; padding: 0 20px; }
    .fold { margin-top: 1.5rem; }
    .fold__toggle { width: 100%; text-align: left; background: #161616; color: #fff; border: 0; border-bottom: 1px solid #2a2a2a; padding: 1rem 1.1rem; font-size: 1.35rem; font-weight: 700; cursor: pointer; }
    .fold__body { padding: 1rem 0 0; }
    .fold__tools { display: flex; gap: 0.6rem; margin-bottom: 0.8rem; }
    .fold__tools input, .fold__tools select { background: #111; color: #fff; border: 1px solid #333; padding: 0.55rem 0.7rem; font-size: 1.05rem; }
    .fold__tools input { flex: 1; }
    .sale-card { display: block; background: #161616; color: #f4f4f4; padding: 1rem 1.1rem; margin-bottom: 0.7rem; text-decoration: none; border: 1px solid transparent; }
    .sale-card:hover { color: #fff; border-color: #F05545; }
    .sale-card h3 { margin: 0 0 0.3rem; font-size: 1.35rem; }
    .sale-card p { margin: 0; font-size: 1.1rem; color: #e4e4e4; }
</style>
{% endblock %}

{% block content %}
<div class="profile-page">
    <div class="profile-page__inner">
        {% include '_profile_card.html' %}
    </div>
</div>
{% endblock %}
